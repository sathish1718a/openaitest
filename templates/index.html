<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI PDF Assistant</title>

<style>
body {
    background: #0f172a;
    color: #e5e7eb;
    font-family: Arial, sans-serif;
}

.container {
    width: 70%;
    max-width: 1000px;
    margin: 40px auto;
    background: #020617;
    padding: 20px;
    border-radius: 10px;
}

h2 {
    text-align: center;
    color: #38bdf8;
}

.chat {
    height: 420px;
    overflow-y: auto;
    padding: 15px;
    border: 1px solid #1e293b;
    border-radius: 6px;
}

.msg {
    margin: 15px 0;
    padding: 12px;
    border-radius: 8px;
    max-width: 80%;
}

.user {
    background: #1d4ed8;
    margin-left: auto;
    text-align: right;
}

.assistant {
    background: #1e293b;
}

form {
    margin-top: 15px;
}

input[type="text"], input[type="file"] {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    background: #020617;
    border: 1px solid #334155;
    color: white;
    border-radius: 6px;
}

button {
    margin-top: 10px;
    padding: 12px;
    width: 100%;
    background: #38bdf8;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0ea5e9;
}

.loading {
    display: none;
    text-align: center;
    margin-top: 10px;
    color: #facc15;
}
</style>

<script>
function showLoading() {
    document.getElementById("loading").style.display = "block";
}
</script>
</head>

<body>

<div class="container">
<h2>📄 AI PDF Assistant</h2>

{% if error %}
<div style="background:#7f1d1d;padding:10px;border-radius:6px;">
{{ error }}
</div>
{% endif %}

<div class="chat">
{% for msg in messages %}
    {% if msg.role == "user" %}
        <div class="msg user"><b>You:</b><br>{{ msg.content }}</div>
    {% elif msg.role == "assistant" %}
        <div class="msg assistant"><b>Assistant:</b><br>{{ msg.content | safe }}</div>
    {% endif %}
{% endfor %}
</div>

<form method="POST" enctype="multipart/form-data" onsubmit="showLoading()">
    <input type="text" name="message" placeholder="Ask a question or upload PDF">
    <input type="file" name="pdf" accept=".pdf">
    <button type="submit">Send / Upload PDF</button>
</form>

<div id="loading" class="loading">
    ⏳ Analyzing document, please wait...
</div>

</div>

</body>
</html>
